apiVersion: v1
kind: Secret
metadata:
  name: biasharaiq-db-secret
  namespace: biasharaiq
type: Opaque
stringData:
  POSTGRES_USER: biasharaiq
  POSTGRES_PASSWORD: biasharaiq_pass
  POSTGRES_DB: biasharaiq
  DATABASE_URL: postgresql://biasharaiq:biasharaiq_pass@biasharaiq-db:5432/biasharaiq
---
apiVersion: v1
kind: Secret
metadata:
  name: biasharaiq-backend-secret
  namespace: biasharaiq
type: Opaque
stringData:
  SECRET_KEY: change-me-in-production-32chars-min
  JWT_SECRET: change-me-in-production-32chars-min
  CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  REDIS_URL: redis://biasharaiq-redis:6379/0
  GEMINI_API_KEY: ""
