# ─────────────────────────────────────────────
# PostgreSQL Deployment + Service
# Mirrors: docker-compose service "db"
#   image: postgres:16-alpine
#   port:  5432
# ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biasharaiq-db
  namespace: biasharaiq
  labels:
    app.kubernetes.io/name: biasharaiq
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: biasharaiq-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: biasharaiq-db
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: biasharaiq-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biasharaiq-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: biasharaiq-db-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "biasharaiq", "-d", "biasharaiq"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "biasharaiq", "-d", "biasharaiq"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: biasharaiq-db
  namespace: biasharaiq
  labels:
    app.kubernetes.io/name: biasharaiq
    app.kubernetes.io/component: database
spec:
  selector:
    app: biasharaiq-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
