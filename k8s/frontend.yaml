apiVersion: apps/v1
kind: Deployment
metadata:
  name: biasharaiq-frontend
  namespace: biasharaiq
  labels:
    app.kubernetes.io/name: biasharaiq
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: biasharaiq-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: biasharaiq-frontend
        app.kubernetes.io/component: frontend
    spec:
      initContainers:
        - name: wait-for-backend
          image: curlimages/curl:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until curl -sf http://biasharaiq-backend:8000/health; do
                echo "Waiting for backend..."
                sleep 3
              done
      containers:
        - name: frontend
          image: biasharaiq-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://biasharaiq-backend:8000"
            - name: NODE_ENV
              value: "production"
            - name: HOSTNAME
              value: "0.0.0.0"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: biasharaiq-frontend
  namespace: biasharaiq
  labels:
    app.kubernetes.io/name: biasharaiq
    app.kubernetes.io/component: frontend
spec:
  selector:
    app: biasharaiq-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
