services:
  db:
    image: postgres:16-alpine
    container_name: biasharaiq_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biasharaiq}
      POSTGRES_USER: ${POSTGRES_USER:-biasharaiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biasharaiq_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/datay
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biasharaiq} -d ${POSTGRES_DB:-biasharaiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: biasharaiq_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biasharaiq_api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://biasharaiq:[REDACTED]@db:5432/biasharaiq}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32chars-min}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars-min}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: biasharaiq_web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
