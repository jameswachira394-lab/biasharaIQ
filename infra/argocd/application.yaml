apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: biasharaiq
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/my-org/biasharaiq.git'
    targetRevision: HEAD
    path: infra/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
