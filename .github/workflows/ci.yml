name: BiasharaIQ Full CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  backend-checks:
    name: Backend — Install, lint, unit tests, security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov bandit

      - name: Lint (flake8)
        run: flake8 . --max-line-length=120

      - name: Run unit tests (pytest)
        run: |
          if [ -d tests ]; then pytest -q --maxfail=1 --disable-warnings; else echo "No backend tests found"; fi

      - name: Security scan (bandit)
        run: |
          bandit -r . -q -lll || true

  frontend-checks:
    name: Frontend — Install, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (next lint)
        run: npx next lint --max-warnings 0 || true

      - name: Type-check (if TypeScript)
        run: |
          if [ -f tsconfig.json ]; then npx tsc --noEmit; fi

      - name: Build Next.js (validate)
        run: npm run build

      - name: Persist frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/

  docker-build-push:
    name: Docker — Build & Push images
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/biasharaiq-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/biasharaiq-frontend:latest

  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest
    needs: frontend-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend for export
        working-directory: frontend
        run: |
          npm run build
          npm run export

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Android SDK & Build Tools
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          components: build-tools;31.0.0,platforms;android-31

      - name: Build Android release (Gradle)
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frontend/android/app/build/outputs/apk/release/

  deploy:
    name: Optional Deploy
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main' && secrets.DEPLOY_PROVIDER != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "DEPLOY: configure deploy steps for your provider (Render, ECS, etc.)"
          echo "Set DEPLOY_PROVIDER secret and add provider-specific steps."
