name: Code Security & Quality Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  
  # BACKEND CODE SCAN & SECURITY
  
  backend-scan:
    name: Backend — Linting, SAST & Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pytest pytest-cov

      - name: Code Quality & Syntax Check (flake8)
        run: |
          # Check Python syntax explicitly and fail only on blocking flake8 errors.
          # Keep compileall diagnostic-only; flake8 is the blocking check below.
          python -m compileall -q . || true
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --exclude=.git,.venv,venv,__pycache__,build,dist \
            --show-source \
            --statistics

      - name: Security SAST Scan (bandit)
        run: |
          bandit -r . -q -lll

      - name: Unit Tests
        run: |
          if [ -d tests ] || find . -name "test_*.py" | grep -q .; then
            pytest -q --maxfail=1 --disable-warnings
          else
            echo "No backend tests found; skipping test execution."
          fi

  
  # FRONTEND CODE SCAN & TYPE CHECK
  
  frontend-scan:
    name: Frontend — Linting, Type Check & Dependency Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Linting (ESLint)
        run: |
          if npm run | grep -q " lint"; then
            npm run lint || true
          else
            npx eslint src || true
          fi

      - name: TypeScript Type Check
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json found; skipping TypeScript check."
          fi

      - name: Dependency Vulnerability Audit
        run: |
          npm audit --audit-level=high || true

  
  # REPOSITORY SECRET & SECURITY SCAN
  
  security-scan:
    name: Repository — Trivy Vulnerability & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability & Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'