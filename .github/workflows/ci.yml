name: BiasharaIQ Full CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'   # bumped from 20 — @capacitor/cli requires >=22

jobs:
  backend-checks:
    name: Backend — Install, lint, unit tests, security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov bandit

      - name: Lint (flake8)
        run: flake8 . --max-line-length=120

      - name: Run unit tests (pytest)
        run: |
          if [ -d tests ]; then pytest -q --maxfail=1 --disable-warnings; else echo "No backend tests found"; fi

      - name: Security scan (bandit)
        # Informational only for now — does not fail the build.
        run: |
          bandit -r . -q -lll || true

  frontend-checks:
    name: Frontend — Install, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (next lint)
        # Informational only for now — does not fail the build.
        run: npx next lint || true

      - name: Type-check (if TypeScript)
        run: |
          if [ -f tsconfig.json ]; then npx tsc --noEmit; fi

      - name: Build Next.js (validate)
        run: npm run build

      - name: Persist frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/

  docker-build-push:
    name: Docker — Build & Push images
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/biasharaiq-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/biasharaiq-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest
    needs: frontend-checks
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend for export
        working-directory: frontend
        run: |
          npm run build
          # next export was removed in Next.js 13+; static export now happens
          # automatically during `next build` when next.config.js sets
          # `output: 'export'`. Only run a separate export script if one
          # is actually defined in package.json.
          if npm run | grep -q " export$"; then npm run export; fi

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android release (Gradle)
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frontend/android/app/build/outputs/apk/release/

  deploy:
    name: Optional Deploy
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    # DEPLOY_PROVIDER is a repo *variable*, not a secret — it's not sensitive,
    # just a flag for whether deploy steps are configured, and `vars` is the
    # conventional/well-supported way to gate on that in an `if:`.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PROVIDER != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "DEPLOY: configure deploy steps for your provider (Render, ECS, etc.)"
          echo "Set the DEPLOY_PROVIDER repo variable and add provider-specific steps."
